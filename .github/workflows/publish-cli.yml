name: Publish CLI to npm
run-name: Publish CLI ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag (run this workflow from the same tag ref)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    env:
      TARGET_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Validate stable release ref
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_REF" == "refs/tags/${TARGET_TAG}" ]]

      - name: Check out the immutable release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TARGET_TAG }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with OIDC support
        run: npm install --global npm@11.5.1

      - name: Validate release and package identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}" > "$RUNNER_TEMP/release.json"
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_TAG}" --jq '.sha')"
          node cli/scripts/verify-published-release.mjs release "$TARGET_TAG" "$remote_sha" "$RUNNER_TEMP/release.json"
          node cli/scripts/check-release-metadata.mjs "${TARGET_TAG#v}" --source-only
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci
        working-directory: cli

      - name: Verify package
        run: |
          npm run typecheck
          npm test
          node --test test/published-release.test.mjs
          npm run test:pack
          node scripts/check-release-metadata.mjs "${TARGET_TAG#v}"
        working-directory: cli

      - name: Recheck release identity before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}" > "$RUNNER_TEMP/release.json"
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_TAG}" --jq '.sha')"
          node cli/scripts/verify-published-release.mjs release "$TARGET_TAG" "$remote_sha" "$RUNNER_TEMP/release.json"

      - name: Check whether this exact version is already published
        id: registry
        run: node scripts/verify-published-release.mjs probe "$TARGET_TAG" "$GITHUB_SHA"
        working-directory: cli

      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.status == 'absent'
        run: npm publish --access public --provenance
        working-directory: cli

      - name: Verify registry provenance and exact consumer installation
        run: node scripts/verify-published-release.mjs verify "$TARGET_TAG" "$GITHUB_SHA"
        working-directory: cli
